{% extends "base.html" %}
{% block title %}Sign In{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-bg">
        <div class="hero-glow glow-1"></div>
        <div class="hero-glow glow-2"></div>
    </div>
    <div class="auth-card">
        <div class="auth-header">
            <svg class="auth-logo" viewBox="0 0 24 24" fill="none">
                <path d="M12 1L3 5V11C3 16.55 6.84 21.74 12 23C17.16 21.74 21 16.55 21 11V5L12 1Z" stroke="currentColor" stroke-width="2"/>
                <path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <h1>Welcome back</h1>
            <p>Sign in to access your secret vault</p>
        </div>

        <form class="auth-form" method="POST" action="{{ url_for('auth.login') }}" id="loginForm">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token is defined else '' }}">

            <div class="form-group">
                <label for="identifier" class="form-label">Username or Email</label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none">
                        <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2M12 11a4 4 0 100-8 4 4 0 000 8z" stroke="currentColor" stroke-width="2"/>
                    </svg>
                    <input type="text" id="identifier" name="identifier" class="form-input"
                           placeholder="Enter username or email" required autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none">
                        <rect x="3" y="11" width="18" height="11" rx="2" stroke="currentColor" stroke-width="2"/>
                        <path d="M7 11V7a5 5 0 0110 0v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    <input type="password" id="password" name="password" class="form-input"
                           placeholder="Enter your password" required autocomplete="current-password">
                    <button type="button" class="input-toggle" data-target="password" aria-label="Toggle password visibility">
                        <svg viewBox="0 0 24 24" fill="none" class="eye-icon"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/></svg>
                    </button>
                </div>
            </div>

            <div class="form-row">
                <label class="checkbox-label">
                    <input type="checkbox" name="remember_me" id="rememberMe">
                    <span class="checkbox-custom"></span>
                    Remember me
                </label>
            </div>

            <button type="submit" class="btn btn-primary btn-full btn-lg" id="loginBtn">
                <span class="btn-text">Sign In</span>
                <span class="btn-loader hidden">
                    <svg class="spinner" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" stroke-dasharray="60" stroke-dashoffset="15"/></svg>
                </span>
            </button>
        </form>

        <div class="auth-footer">
            <p>Don't have an account? <a href="{{ url_for('auth.register') }}">Create one</a></p>
        </div>
    </div>
</div>
{% endblock %}
