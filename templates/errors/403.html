{% extends "base.html" %}
{% block title %}Access Denied{% endblock %}

{% block content %}
<div class="page-container page-narrow">
    <div class="error-container">
        <div class="error-icon">
            <svg viewBox="0 0 24 24" fill="none">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" stroke="currentColor" stroke-width="2"/>
                <path d="M12 8v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <circle cx="12" cy="16" r="1" fill="currentColor"/>
            </svg>
        </div>
        <h1 class="error-code">403</h1>
        <h2 class="error-title">Access Denied</h2>
        <p class="error-msg">You don't have permission to access this resource. If you believe this is an error, please contact an administrator.</p>
        <div class="error-actions">
            <a href="{{ url_for('dashboard.dashboard') }}" class="btn btn-primary">Return to Dashboard</a>
            <a href="javascript:history.back()" class="btn btn-outline">Go Back</a>
        </div>
    </div>
</div>
{% endblock %}
