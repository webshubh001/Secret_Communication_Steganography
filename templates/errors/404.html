{% extends "base.html" %}
{% block title %}Page Not Found{% endblock %}

{% block content %}
<div class="page-container page-narrow">
    <div class="error-container">
        <div class="error-icon">
            <svg viewBox="0 0 24 24" fill="none">
                <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M10 10l4 4m0-4l-4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
        </div>
        <h1 class="error-code">404</h1>
        <h2 class="error-title">Page Not Found</h2>
        <p class="error-msg">The page you are looking for has been moved, deleted, or does not exist.</p>
        <div class="error-actions">
            <a href="{{ url_for('index') }}" class="btn btn-primary">Go Home</a>
        </div>
    </div>
</div>
{% endblock %}
